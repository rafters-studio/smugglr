# cargo-release configuration for the smugglr workspace.
# The crates share one version and release together.

allow-branch = ["main"]
shared-version = true
consolidate-commits = true
tag-name = "v{{version}}"
tag-message = "smugglr {{version}}"
sign-tag = true
pre-release-commit-message = "release: v{{version}}"
push = false
publish = false

[[pre-release-replacements]]
file = "CHANGELOG.md"
search = "## \\[Unreleased\\]"
replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}"
min = 1
