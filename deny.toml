[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # basic-toml is unmaintained with no safe upgrade, and reaches smugglr
    # only as a dev-dependency (rstest-bdd -> i18n-embed -> i18n-embed-impl
    # -> i18n-config), never the binary. Remove when rstest-bdd drops it.
    { id = "RUSTSEC-2026-0374", reason = "dev-dependency only via rstest-bdd; no safe upgrade upstream; revisit when rstest-bdd drops basic-toml" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # webpki-roots, the root certificates ureq's rustls uses so the HTTP-SQL
    # place reaches https services, is under this permissive licence.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
