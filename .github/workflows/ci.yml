name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      # smugglr-wasm is #![cfg(target_arch = "wasm32")], so the host clippy run
      # above compiles it to nothing -- its lints never gate. Run clippy against
      # the wasm32 target explicitly so wasm-only lints are caught (#155).
      - name: Clippy (wasm32)
        run: cargo clippy -p smugglr-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh scripts/publish-crate.sh

  versions:
    name: Crate versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Inter-crate deps resolve by path locally, so a stale version req is
      # invisible to every other job here and only surfaces in the published
      # artifact, where it is immutable. This is the one check that reads
      # what `cargo publish` would actually ship.
      - run: python3 scripts/check-crate-versions.py

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  e2e-smugglr-npm:
    name: E2E (smugglr npm + OPFS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/smugglr/pnpm-lock.yaml
      - name: Run smugglr-wasm unit tests (wasm32, node)
        # The crate is #![cfg(target_arch = "wasm32")], so host `cargo test`
        # runs none of its tests; they execute only via wasm-pack (#155).
        run: wasm-pack test --node crates/smugglr-wasm
      - name: Install deps
        working-directory: packages/smugglr
        run: pnpm install --frozen-lockfile
      - name: Build smugglr
        working-directory: packages/smugglr
        run: pnpm build
      - name: Install Playwright browsers
        working-directory: packages/smugglr
        run: pnpm test:e2e:install
      - name: Run e2e
        working-directory: packages/smugglr
        run: pnpm test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/smugglr/playwright-report
          retention-days: 7
