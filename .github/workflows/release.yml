name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          name: smugglr ${{ github.ref_name }}
          generate_release_notes: true

  build:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: smugglr
          target: ${{ matrix.target }}
          archive: smugglr-${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Refuse before anything is published: the tag must name the version
      # in [workspace.package].
      - name: Check tag matches workspace version
        run: |
          version="$(awk '
            /^\[/ { in_pkg = ($0 == "[workspace.package]") }
            in_pkg && /^version[[:space:]]*=/ { split($0, parts, "\""); print parts[2]; exit }
          ' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::no version found in [workspace.package] of Cargo.toml"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version v$version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth

      # Dependency order: core has no internal deps; place and memory need
      # core; sync and multi need core, memory and place; mesh needs those
      # and multi; web needs those and sync; smugglr needs core, memory,
      # mesh, multi, place and sync. A crate whose version is already
      # on crates.io counts as published, so a run that failed partway can
      # be re-run and publishes only what is missing. A false "not
      # published" is safe (the publish is attempted and "already exists"
      # is success); a false "published" is not, so lookups fail toward
      # attempting.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          publish_crate() {
            crate="$1"
            version="$(cargo metadata --format-version 1 --no-deps \
              | jq -r --arg n "$crate" '.packages[] | select(.name == $n) | .version')"
            if [ -z "$version" ]; then
              echo "::error::publish failed for $crate: not found in the workspace"
              return 1
            fi

            case "${#crate}" in
              1) index_path="1/$crate" ;;
              2) index_path="2/$crate" ;;
              3) index_path="3/${crate:0:1}/$crate" ;;
              *) index_path="${crate:0:2}/${crate:2:2}/$crate" ;;
            esac

            if body="$(curl -sf --max-time 30 "https://index.crates.io/$index_path")" \
              && printf '%s' "$body" | jq -e --arg v "$version" 'select(.vers == $v)' > /dev/null; then
              echo "$crate@$version already on crates.io, skipping"
              return 0
            fi

            echo "publishing $crate@$version"
            if output="$(cargo publish -p "$crate" 2>&1)"; then
              echo "$output"
              return 0
            fi
            echo "$output"
            if printf '%s' "$output" | grep -q "already exists"; then
              echo "$crate@$version was already published; treating as success"
              return 0
            fi
            echo "::error::publish failed for $crate@$version"
            return 1
          }

          for crate in smugglr-core smugglr-place smugglr-memory smugglr-sync smugglr-multi smugglr-mesh smugglr-web smugglr; do
            publish_crate "$crate"
          done
