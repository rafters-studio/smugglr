[package]
name = "smugglr-web"
description = "The smugglr engine in the browser, compiled to WASM with wasm-bindgen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
smugglr-core = { workspace = true }
smugglr-memory = { workspace = true }
smugglr-multi = { workspace = true }
smugglr-place = { workspace = true }
smugglr-sync = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }

[dev-dependencies]
smugglr-place = { workspace = true, features = ["native"] }
smugglr-sync = { workspace = true }
smugglr-multi = { workspace = true }
rusqlite = { workspace = true }
rstest = { workspace = true }
rstest-bdd = { workspace = true }
rstest-bdd-macros = { workspace = true }

[lints]
workspace = true
