[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/rafters-studio/smugglr"
authors = ["Rafters Studio"]

[workspace.dependencies]
smugglr-core = { path = "crates/smugglr-core", version = "0.6.0" }
smugglr-memory = { path = "crates/smugglr-memory", version = "0.6.0" }
smugglr-multi = { path = "crates/smugglr-multi", version = "0.6.0" }
smugglr-mesh = { path = "crates/smugglr-mesh", version = "0.6.0" }
smugglr-place = { path = "crates/smugglr-place", version = "0.6.0", default-features = false }
smugglr-sync = { path = "crates/smugglr-sync", version = "0.6.0" }
# The local file place (smugglr-place). `bundled`: SQLite is built in, so the
# binary reads any file the same way; `functions`: the row hash runs as a SQL
# function on the connection, where the data lives.
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
thiserror = "2"
# The mesh (smugglr-mesh): each datagram sealed with XChaCha20-Poly1305
# under a key derived from the shared key, with a fresh random 24-byte nonce
# (FR-SMUGGLR-078 rev 11); `getrandom` gives the nonces, the echo waits and
# the keys smugglr mesh keygen writes. Approved 2026-10-25 (#520); revisable.
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc", "getrandom"] }
# The mesh's socket: several nodes on one machine share one broadcast port
# (SO_REUSEADDR, SO_REUSEPORT), which std cannot set. Approved 2026-10-25
# (#520); revisable.
socket2 = { version = "0.6", features = ["all"] }
# The HTTP-SQL place (smugglr-place). Blocking, because a place is
# synchronous; `rustls`: https, so a hosted service is reached over TLS.
# Current choice 2026-10-19 (#504); revisable.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
# The row hash (smugglr-core); does no I/O and reads no clock.
# `pure`: the portable Rust build, no C or assembly, so it builds for wasm32.
blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }
# The record (smugglr-core): its shape and its JSON. Neither does I/O or
# reads a clock, and both build for wasm32.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The engine in the browser (smugglr-web). Pinned exactly: the
# wasm-bindgen CLI that wasm-pack runs must match it.
# Current choice 2026-10-22 (#524); revisable.
wasm-bindgen = "=0.2.129"
# The config file (smugglr, the CLI): read only, so its parser, and display
# for naming a setting smugglr cannot use.
toml = { version = "1", default-features = false, features = ["parse", "serde", "display"] }
# Acceptance-scenario runner (dev-dependencies only). rstest is a required
# peer: the `scenarios!` expansion names `rstest` directly.
rstest = "0.28"
rstest-bdd = "0.6"
rstest-bdd-macros = "0.6"
# Reads `cargo metadata` for the crate-map check (xtask).
cargo_metadata = "0.23"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
strip = true

# The mesh scenarios measure timing (a lost copy repaired within a second,
# resends within a quarter of what a node sends); unoptimized, the cipher,
# the hash and the JSON make a debug build too slow to show it. Current
# choice 2026-10-26 (#520); revisable.
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.smugglr-mesh]
opt-level = 2
[profile.dev.package.smugglr-core]
opt-level = 2
[profile.dev.package.smugglr-place]
opt-level = 2
