[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/rafters-studio/smugglr"
authors = ["Rafters Studio"]

[workspace.dependencies]
smugglr-core = { path = "crates/smugglr-core", version = "0.1.0" }
smugglr-memory = { path = "crates/smugglr-memory", version = "0.1.0" }
smugglr-place = { path = "crates/smugglr-place", version = "0.1.0" }
# The local file place (smugglr-place). `bundled`: SQLite is built in, so the
# binary reads any file the same way; `functions`: the row hash runs as a SQL
# function on the connection, where the data lives.
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
thiserror = "2"
# The HTTP-SQL place (smugglr-place). Blocking, because a place is
# synchronous; `rustls`: https, so a hosted service is reached over TLS.
# Current choice 2026-10-19 (#504); revisable.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
# The row hash (smugglr-core); does no I/O and reads no clock.
# `pure`: the portable Rust build, no C or assembly, so it builds for wasm32.
blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }
# The record (smugglr-core): its shape and its JSON. Neither does I/O or
# reads a clock, and both build for wasm32.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Acceptance-scenario runner (dev-dependencies only). rstest is a required
# peer: the `scenarios!` expansion names `rstest` directly.
rstest = "0.28"
rstest-bdd = "0.6"
rstest-bdd-macros = "0.6"
# Reads `cargo metadata` for the crate-map check (xtask).
cargo_metadata = "0.23"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
strip = true
